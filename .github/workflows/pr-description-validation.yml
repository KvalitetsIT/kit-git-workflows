name: PR Body Validation (Reusable)

on:
  workflow_call:
    inputs:
      min_length:
        description: "Minimum non-whitespace character count inside a required-text block"
        type: number
        required: false
        default: 10
      forbidden_labels:
        description: "Newline-separated labels that must not be present before merge"
        type: string
        required: false
        default: |
          production release tested
          production release no impact

permissions:
  pull-requests: read # Required to read pull request body for validation

jobs:
  required-text-check:
    name: required-text-check
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-required-text-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Fail if required-text region is empty
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          START_TAG: "<!-- required-text-start -->"
          END_TAG: "<!-- required-text-end -->"
          MIN_LENGTH: ${{ inputs.min_length }}
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const minLen = Math.max(1, Number(process.env.MIN_LENGTH) || 1);

            const startTag = process.env.START_TAG;
            const endTag = process.env.END_TAG;

            if (body.includes(startTag) && !body.includes(endTag))
              return core.setFailed("Found required-text-start but no required-text-end.");
            if (body.includes(endTag) && !body.includes(startTag))
              return core.setFailed("Found required-text-end but no required-text-start.");

            const re = new RegExp(`${esc(startTag)}([\\s\\S]*?)${esc(endTag)}`, "g");
            const matches = [...body.matchAll(re)];
            if (matches.length === 0) return;

            const bad = matches.filter(m => m[1].replace(/\s+/g, "").length < minLen).length;
            if (bad) core.setFailed(`${bad} required-text block(s) are empty. Fill in text between the tags.`);

  checklist-check:
    name: checklist-check
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-checklist-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Fail if checklist has unchecked items
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IGNORE_START_TAG: "<!-- ignore-task-list-start -->"
          IGNORE_END_TAG: "<!-- ignore-task-list-end -->"
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const ignoreRe = new RegExp(`${esc(process.env.IGNORE_START_TAG)}[\\s\\S]*?${esc(process.env.IGNORE_END_TAG)}`, "g");
            const cleaned = body.replace(ignoreRe, "");
            const unchecked = (cleaned.match(/^\s*-\s*\[\s*\]\s+/gm) || []).length;
            if (unchecked) core.setFailed(`${unchecked} unchecked checklist item(s) found in PR description.`);

  forbidden-pre-merge-label-check:
    name: forbidden-pre-merge-label-check
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-forbidden-label-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Fail if post-merge labels are set before merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORBIDDEN_LABELS: ${{ inputs.forbidden_labels }}
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed("This workflow must be run in the context of a pull request.");
              return;
            }

            const forbidden = process.env.FORBIDDEN_LABELS
              .split(/\r?\n/)
              .map(x => x.trim().toLowerCase())
              .filter(Boolean);

            const labels = (pr.labels ?? [])
              .map(label => label.name.toLowerCase());

            const matches = labels.filter(label => forbidden.includes(label));

            if (matches.length > 0) {
              core.setFailed(
                `The following label(s) must only be added after the PR is merged: ${matches.join(", ")}`
              );
            }